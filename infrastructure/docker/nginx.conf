# Frontend static server + reverse proxy to the API (LAN/SSH-tunnel only)
# Serves the built SPA and forwards /api, /health, /ready to the api container.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (repeated in every location that adds headers)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # Everything is self-hosted (fonts bundled, no CDN): a strict CSP holds.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # API + health probes -> backend (client IP forwarded for audit/rate limit)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 2m;
    }
    location = /health  { proxy_pass http://api:8000/health; }
    location = /ready   { proxy_pass http://api:8000/ready;  }

    # Never serve dotfiles
    location ~ /\. { deny all; }

    # Hashed assets: cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # SPA fallback (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
