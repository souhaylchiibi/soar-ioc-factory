# Frontend static server + reverse proxy to the API (LAN/SSH-tunnel only)
# Serves the built SPA and forwards /api, /health, /ready to the api container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API + health probes -> backend
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location = /health  { proxy_pass http://api:8000/health; }
    location = /ready   { proxy_pass http://api:8000/ready;  }

    # SPA fallback (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
